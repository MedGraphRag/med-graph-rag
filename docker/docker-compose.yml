version: '3.8'

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: medgraphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # Веб-интерфейс в браузере
      - "7687:7687"  # Подключение для кода на Python
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-medgraph_secret_2025}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - ../data/processed:/var/lib/neo4j/import

volumes:
  neo4j_data:
